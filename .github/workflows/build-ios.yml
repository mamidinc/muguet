name: Build Muguet IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show build requirements
        run: |
          xcodebuild -version
          rustc --version
          cargo --version
          echo "Muguet source downloaded successfully."
